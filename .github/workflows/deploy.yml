# Builds the static site and deploys it to Cloudflare Workers on every push to
# main (see DEPLOY.md). The build always runs; the deploy step skips with a
# notice until the CLOUDFLARE_API_TOKEN repository secret exists.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Public values baked into the page; only this build sets them, so local
      # and CI builds report nothing.
      # Sentry project sprite-bench (lib/error-reporting.ts).
      NEXT_PUBLIC_SENTRY_DSN: https://321af1a079a95703a7c2dfc3db8ef49b@o4507767562371072.ingest.us.sentry.io/4512375298916352
      NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Waiting for setup
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Built, but skipping the deploy until the CLOUDFLARE_API_TOKEN secret is added (DEPLOY.md)."
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
