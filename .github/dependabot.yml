# Weekly, grouped dependency updates. Grouping keeps it to a couple of PRs a
# week; CI (lint, types, unit and E2E tests) gates every one of them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 waits until typescript-eslint (via eslint-config-next) supports it;
      # today it allows <6.1 and the lint step throws on 7.
      - dependency-name: typescript
        versions: [">=7"]
      # @types/node follows the oldest Node the app supports (engines: >=20.9), so the
      # types never offer an API that Node 20 lacks.
      - dependency-name: "@types/node"
        versions: [">=21"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
